# GitHub Actions workflow reindexed
name: Build Windows private test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      VCPKG_ROOT: C:\wsvcpkg
      VCPKG_BINARY_SOURCES: clear;files,C:\vcpkg-bincache,readwrite
      RUNNING_CI: "1"
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python requirements
        run: python -m pip install -r tools/requirements.txt

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        id: vcpkg-cache
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-${{ hashFiles('tools/vcpkg/vcpkg.json', 'tools/vcpkg/vcpkg-configuration.json') }}

      - name: Install vcpkg
        shell: cmd
        run: |
          if not exist C:\vcpkg-bincache mkdir C:\vcpkg-bincache
          git clone https://github.com/Windscribe/ws-vcpkg-registry.git C:\wsreg || exit /b 1
          set /p VCPKG_COMMIT=<C:\wsreg\install-vcpkg\vcpkg_commit.txt
          git clone https://github.com/Microsoft/vcpkg.git C:\wsvcpkg || exit /b 1
          git -C C:\wsvcpkg checkout %VCPKG_COMMIT% || exit /b 1
          git -C C:\wsvcpkg apply C:\wsreg\install-vcpkg\patches\vcpkg_configure_cmake.patch || exit /b 1
          git -C C:\wsvcpkg apply C:\wsreg\install-vcpkg\patches\ios_toolchain.patch || exit /b 1
          call C:\wsvcpkg\bootstrap-vcpkg.bat -disableMetrics || exit /b 1
          xcopy /Y /Q C:\wsreg\triplets\*.cmake C:\wsvcpkg\triplets\
          if not exist C:\wsvcpkg\vcpkg.exe exit /b 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the custom vcpkg root
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_ROOT=C:\wsvcpkg'

      - name: Install vcpkg dependencies
        run: >
          C:\wsvcpkg\vcpkg install
          --x-install-root=C:\wsvcpkg\installed
          --x-manifest-root=tools\vcpkg
          --triplet=ws-x64-windows-static-release
          --host-triplet=ws-x64-windows-static-release
          --clean-buildtrees-after-build
          --clean-packages-after-build

      - name: Save vcpkg binary cache
        if: success() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-bincache
          key: vcpkg-${{ hashFiles('tools/vcpkg/vcpkg.json', 'tools/vcpkg/vcpkg-configuration.json') }}

      - name: Build native libraries
        run: |
          python tools\deps\install_openvpn_dco.py; if ($LASTEXITCODE) { exit 1 }
          python tools\deps\install_wintun.py;      if ($LASTEXITCODE) { exit 1 }
          python tools\deps\install_wstunnel.py;    if ($LASTEXITCODE) { exit 1 }

      - name: Build app and installer
        run: python tools\build_all.py --dev-mode

      - name: Sign private test installers
        shell: pwsh
        timeout-minutes: 15
        env:
          CUSTOM_SIGNING_PFX_B64: ${{ secrets.CUSTOM_SIGNING_PFX_B64 }}
          CUSTOM_SIGNING_PFX_PASSWORD: ${{ secrets.CUSTOM_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CUSTOM_SIGNING_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:CUSTOM_SIGNING_PFX_PASSWORD)) {
            throw 'Missing private test signing certificate Actions secrets.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'private-test-signing.p12'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CUSTOM_SIGNING_PFX_B64))
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $pfxPath,
            $env:CUSTOM_SIGNING_PFX_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          $certificatePath = Join-Path $env:RUNNER_TEMP 'private-test-signing.cer'
          [IO.File]::WriteAllBytes($certificatePath, $certificate.RawData)
          # Trust the certificate in the machine Root store. The user Root store shows a
          # confirmation dialog that never returns on a headless runner.
          Import-Certificate -FilePath $certificatePath -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $signtool = Get-ChildItem $sdkBin -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found.' }
          $installers = @(Get-ChildItem 'build-exe' -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No Windows installer was produced.' }
          foreach ($installer in $installers) {
            & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:CUSTOM_SIGNING_PFX_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($installer.Name)." }
            & $signtool.FullName verify /pa /all $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($installer.Name)." }
          }
          Remove-Item -LiteralPath $pfxPath -Force
          Remove-Item -LiteralPath $certificatePath -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windscribe-windows-private-test
          path: build-exe\*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cmake -DINTEGRATION=gui -DNO_SUFFIX=1 -P cmake/print_version.cmake 2>&1 | tr -d '[:space:]')"
          short="${GITHUB_SHA:0:7}"
          tag="v${version}-private-${short}"
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          shopt -s nullglob
          installers=(build-exe/*.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one installer, found ${#installers[@]}." >&2
            exit 1
          fi
          cp "${installers[0]}" "$release_dir/Wind-Windows-${version}.exe"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          | سیستم | فایل نصب |
          |---|---|
          | ویندوز | \`Wind-Windows-${version}.exe\` |
          | مک | \`Wind-Mac-${version}.dmg\` |
          | لینوکس | \`Wind-Linux-${version}.deb\` |

          هر سیستم جداگانه بیلد می‌شود. اگر فایلی هنوز در این فهرست نیست، بیلد آن تمام نشده است.

          فایل‌های \`.sig\` و \`.cert.pem\` فقط برای بررسی امضای نسخهٔ لینوکس هستند و برای نصب لازم نیستند.

          نسخهٔ آزمایشی خصوصی از کامیت \`${GITHUB_SHA}\`. امضا با گواهی خصوصی انجام شده و notarize نشده است.
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Wind Desktop ${version} (${short})" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              || true
          fi
          gh release upload "$tag" "$release_dir"/* --repo "$GITHUB_REPOSITORY" --clobber
