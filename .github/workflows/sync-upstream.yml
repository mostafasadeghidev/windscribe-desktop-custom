# GitHub Actions workflow reindexed
name: Prepare upstream update pull request

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream into a review branch
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Windscribe/Desktop-App.git
          git fetch upstream master
          if [[ "$(git rev-list --count master..upstream/master)" == "0" ]]; then
            echo "No upstream commits to merge."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="upstream-sync-$(date -u +%Y%m%d-%H%M%S)"
          git switch -c "$branch" master
          if ! git merge --no-edit upstream/master; then
            git merge --abort
            echo "Upstream changes conflict with local changes. Resolve the merge locally, then push a branch and open a pull request."
            exit 1
          fi
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open review pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr create --repo "${{ github.repository }}" --base master --head "${{ steps.merge.outputs.branch }}"
          --title "Sync Windscribe desktop upstream"
          --body "Merges the latest Windscribe/Desktop-App master into this private test repository. Review the diff and run the platform build workflows before merging."
