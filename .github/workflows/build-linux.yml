# GitHub Actions workflow reindexed
name: Build Linux private test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk for the Qt build
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/lib/jvm
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          df -h /

      - name: Restore Linux native library cache
        uses: actions/cache@v4
        id: linux-libs
        with:
          path: build-libs
          key: linux-build-libs-${{ hashFiles('tools/deps/**', 'tools/vars/**') }}

      - name: Build builder image
        run: docker build -t ws-builder .

      - name: Install vcpkg
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wsvcpkg"
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/wsvcpkg:/vcpkg-cache" ws-builder /bin/bash -lc \
            'git clone https://github.com/Windscribe/ws-vcpkg-registry.git /tmp/ws-vcpkg-registry && /tmp/ws-vcpkg-registry/install-vcpkg/vcpkg_install.sh /vcpkg-cache/root'

      - name: Build Linux native libraries
        if: steps.linux-libs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          for lib in wireguard amneziawg wstunnel; do
            docker run --rm -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/wsvcpkg:/vcpkg-cache" ws-builder /bin/bash -lc "git config --global --add safe.directory /w && cd /w/tools/deps && ./install_$lib"
          done

      - name: Build app and Debian package
        shell: bash
        run: |
          docker run --rm -e VCPKG_ROOT=/vcpkg-cache/root -v "$GITHUB_WORKSPACE:/w" -v "$RUNNER_TEMP/wsvcpkg:/vcpkg-cache" ws-builder /bin/bash -lc 'git config --global --add safe.directory /w && cd /w/tools && ./build_all --dev-mode'

      - name: Show Qt build failure details
        if: failure()
        shell: bash
        run: |
          docker run --rm -v "$RUNNER_TEMP/wsvcpkg:/vcpkg-cache" ws-builder /bin/bash -lc \
            'log=/vcpkg-cache/root/buildtrees/qtbase/install-ws-x64-linux-rel-out.log; if [ -f "$log" ]; then tail -n 160 "$log"; else echo "Qt build log not found: $log"; fi'

      - name: Sign Debian packages with the private test certificate
        shell: bash
        env:
          CUSTOM_SIGNING_PFX_B64: ${{ secrets.CUSTOM_SIGNING_PFX_B64 }}
          CUSTOM_SIGNING_PFX_PASSWORD: ${{ secrets.CUSTOM_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_SIGNING_PFX_B64" || -z "$CUSTOM_SIGNING_PFX_PASSWORD" ]]; then
            echo "Missing private test signing certificate Actions secrets." >&2
            exit 1
          fi
          p12="$RUNNER_TEMP/private-test-signing.p12"
          key="$RUNNER_TEMP/private-test-signing-key.pem"
          cert="$RUNNER_TEMP/private-test-signing-cert.pem"
          trap 'rm -f "$p12" "$key" "$cert"' EXIT
          printf '%s' "$CUSTOM_SIGNING_PFX_B64" | base64 --decode > "$p12"
          openssl pkcs12 -in "$p12" -nocerts -nodes -passin env:CUSTOM_SIGNING_PFX_PASSWORD -out "$key"
          openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:CUSTOM_SIGNING_PFX_PASSWORD -out "$cert"
          shopt -s nullglob
          packages=(build-exe/*.deb)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No Debian package was produced." >&2
            exit 1
          fi
          openssl x509 -in "$cert" -pubkey -noout > "$RUNNER_TEMP/private-test-signing-public.pem"
          for package in "${packages[@]}"; do
            openssl dgst -sha256 -sign "$key" -out "$package.sig" "$package"
            cp "$cert" "$package.cert.pem"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/private-test-signing-public.pem" -signature "$package.sig" "$package"
          done
          rm -f "$RUNNER_TEMP/private-test-signing-public.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: windscribe-linux-private-test-amd64
          path: |
            build-exe/*.deb
            build-exe/*.deb.sig
            build-exe/*.deb.cert.pem
          if-no-files-found: error
          retention-days: 14
