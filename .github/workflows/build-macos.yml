# GitHub Actions workflow reindexed
name: Build macOS private test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Import private test signing identity
        shell: bash
        env:
          CUSTOM_SIGNING_PFX_B64: ${{ secrets.CUSTOM_SIGNING_PFX_B64 }}
          CUSTOM_SIGNING_PFX_PASSWORD: ${{ secrets.CUSTOM_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CUSTOM_SIGNING_PFX_B64" || -z "$CUSTOM_SIGNING_PFX_PASSWORD" ]]; then
            echo "Missing private test signing certificate Actions secrets." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/private-test.keychain-db"
          p12="$RUNNER_TEMP/private-test-signing.p12"
          cert_pem="$RUNNER_TEMP/private-test-signing-cert.pem"
          cert_der="$RUNNER_TEMP/private-test-signing-cert.der"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$CUSTOM_SIGNING_PFX_B64" | base64 --decode > "$p12"
          openssl pkcs12 -in "$p12" -clcerts -nokeys -passin env:CUSTOM_SIGNING_PFX_PASSWORD -out "$cert_pem"
          openssl x509 -in "$cert_pem" -outform DER -out "$cert_der"
          identity="$(openssl x509 -in "$cert_pem" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -f pkcs12 -k "$keychain" -P "$CUSTOM_SIGNING_PFX_PASSWORD" -A
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign "$cert_der"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F "$identity"
          echo "PRIVATE_TEST_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: brew install libtool automake go

      - name: Install Python requirements
        run: python -m pip install -r tools/requirements.txt

      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/Windscribe/ws-vcpkg-registry.git "$RUNNER_TEMP/ws-vcpkg-registry"
          bash "$RUNNER_TEMP/ws-vcpkg-registry/install-vcpkg/vcpkg_install.sh" "$RUNNER_TEMP/wsvcpkg"
          echo "VCPKG_ROOT=$RUNNER_TEMP/wsvcpkg" >> "$GITHUB_ENV"

      - name: Build macOS native libraries
        shell: bash
        run: |
          bash ./tools/deps/install_wireguard
          bash ./tools/deps/install_amneziawg
          bash ./tools/deps/install_wstunnel

      - name: Build app and test installer
        run: python tools/build_all.py --dev-mode

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/private-test.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/private-test-signing.p12" "$RUNNER_TEMP/private-test-signing-cert.pem"
          rm -f "$RUNNER_TEMP/private-test-signing-cert.der"

      - uses: actions/upload-artifact@v4
        with:
          name: windscribe-macos-private-test-${{ runner.arch }}
          path: build-exe/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cmake -DINTEGRATION=gui -DNO_SUFFIX=1 -P cmake/print_version.cmake 2>&1 | tr -d '[:space:]')"
          short="${GITHUB_SHA:0:7}"
          tag="v${version}-private-${short}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Private test ${version} (${short})" \
              --notes "Private test build of commit ${GITHUB_SHA}. Installers are signed with the self-signed private test certificate; they are not notarized and carry no vendor reputation." \
              || true
          fi
          gh release upload "$tag" build-exe/*.dmg --repo "$GITHUB_REPOSITORY" --clobber
